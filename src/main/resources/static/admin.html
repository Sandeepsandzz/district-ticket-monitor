<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>District Ticket Monitor Admin</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#121c2f; --muted:#94a3b8; --text:#e5edf8; --accent:#38bdf8; --danger:#fb7185; --ok:#4ade80; }
    * { box-sizing: border-box; }
    body { margin:0; background:linear-gradient(145deg,#0b1220,#17233b); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { max-width:1200px; margin:0 auto; padding:28px 18px 48px; }
    h1 { margin:0 0 4px; font-size:clamp(24px,4vw,36px); }
    h2 { margin:0 0 12px; font-size:18px; }
    .subtitle,.muted { color:var(--muted); }
    .toolbar,.cards,.panel { background:rgba(18,28,47,.9); border:1px solid #263653; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,.2); }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:22px 0; padding:14px; }
    input { min-width:260px; flex:1; border:1px solid #334765; border-radius:9px; background:#0c1628; color:var(--text); padding:10px 12px; }
    button { border:0; border-radius:9px; padding:10px 13px; color:#062033; background:var(--accent); cursor:pointer; font-weight:700; }
    button.secondary { background:#334765; color:var(--text); }
    button.danger { background:var(--danger); color:#2a0710; }
    button:disabled { cursor:not-allowed; opacity:.55; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1px; overflow:hidden; margin-bottom:18px; }
    .card { background:rgba(18,28,47,.9); padding:18px; }
    .card strong { display:block; font-size:28px; margin-top:5px; }
    .panel { padding:18px; overflow:auto; }
    .panel + .panel { margin-top:18px; }
    table { width:100%; border-collapse:collapse; min-width:920px; }
    th,td { text-align:left; border-bottom:1px solid #263653; padding:11px 8px; vertical-align:top; }
    th { color:#bae6fd; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
    .pill { display:inline-block; padding:3px 8px; border-radius:99px; font-size:12px; font-weight:700; }
    .pill.ok { background:#123a2a; color:var(--ok); }
    .pill.paused { background:#3d2a15; color:#fbbf24; }
    .actions { display:flex; flex-wrap:wrap; gap:6px; }
    .actions button { padding:7px 9px; font-size:12px; }
    #message { min-height:24px; margin:8px 0; color:#bae6fd; }
    code { color:#bae6fd; }
  </style>
</head>
<body>
<main>
  <h1>District Ticket Monitor</h1>
  <div class="subtitle">Admin dashboard for Vizag movie watches and scraper health.</div>

  <section class="toolbar">
    <input id="token" type="password" placeholder="API_ADMIN_TOKEN">
    <button id="refresh">Refresh</button>
    <button id="check" class="secondary">Check tickets now</button>
    <button id="export" class="secondary">Export watches</button>
    <button id="import" class="secondary">Import watches</button>
    <input id="backupFile" type="file" accept="application/json,.json" hidden>
    <span class="muted">Token is sent only as <code>X-Admin-Token</code>.</span>
  </section>
  <div id="message"></div>

  <section class="cards">
    <div class="card"><span class="muted">Total watches</span><strong id="total">—</strong></div>
    <div class="card"><span class="muted">Active watches</span><strong id="active">—</strong></div>
    <div class="card"><span class="muted">Paused watches</span><strong id="paused">—</strong></div>
    <div class="card"><span class="muted">Scraper</span><strong id="scraper">—</strong></div>
  </section>

  <section class="panel">
    <h2>Scraper status</h2>
    <div id="scraperDetails" class="muted">Enter the admin token and refresh.</div>
  </section>

  <section class="panel">
    <h2>Watches</h2>
    <table>
      <thead><tr><th>ID</th><th>Movie</th><th>Chat</th><th>Filters</th><th>Alerts</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="watches"><tr><td colspan="7" class="muted">No data loaded.</td></tr></tbody>
    </table>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const token = () => $('token').value.trim();
  const headers = () => ({'X-Admin-Token': token(), 'Accept':'application/json'});
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const price = value => value == null ? 'Any' : '₹' + Number(value).toFixed(2).replace(/\.00$/, '');
  const date = value => value ? new Date(value).toLocaleString() : 'Never';
  function message(text, error=false) { $('message').textContent = text; $('message').style.color = error ? '#fb7185' : '#bae6fd'; }
  async function api(path, options={}) {
    if (!token()) throw new Error('Enter API_ADMIN_TOKEN first.');
    const response = await fetch(path, { ...options, headers: {...headers(), ...(options.headers || {})} });
    if (!response.ok) throw new Error(response.status + ' ' + (await response.text() || response.statusText));
    return response.status === 204 ? null : response.json();
  }
  async function load() {
    try {
      message('Loading…');
      const [summary, watches] = await Promise.all([api('/api/admin/summary'), api('/api/admin/watches')]);
      $('total').textContent = summary.totalWatches;
      $('active').textContent = summary.activeWatches;
      $('paused').textContent = summary.pausedWatches;
      $('scraper').textContent = summary.scraper.status;
      const s = summary.scraper;
      $('scraperDetails').innerHTML = `<span class="pill ${s.status === 'UP' ? 'ok' : 'paused'}">${esc(s.status)}</span> &nbsp; Last success: ${esc(date(s.lastSuccessAt))} &nbsp; Last failure: ${esc(date(s.lastFailureAt))} &nbsp; Consecutive failures: ${esc(s.consecutiveFailures)}${s.lastFailureMessage ? ' &nbsp; Error: ' + esc(s.lastFailureMessage) : ''}`;
      $('watches').innerHTML = watches.length ? watches.map(row).join('') : '<tr><td colspan="7" class="muted">No watches found.</td></tr>';
      message('Updated ' + new Date().toLocaleTimeString());
    } catch (e) { message(e.message, true); }
  }
  function row(w) {
    const paused = w.acknowledged;
    const filters = `${esc(w.theatreName || '—')} · ${esc(w.screenFilter || '—')}<br>${esc(w.targetDate || '—')}<br><span class="muted">${esc(w.lastCheckStatus || 'NOT CHECKED')} · ${esc(date(w.lastCheckedAt))}<br>${esc(w.lastCheckMessage || '')}</span>`;
    return `<tr><td>#${esc(w.id)}</td><td><strong>${esc(w.movieName)}</strong><br><span class="muted">${esc(w.city)}</span></td><td><code>${esc(w.chatId)}</code></td><td>${filters}</td><td>${esc(w.alertCount)}<br><span class="muted">${esc(date(w.lastAlertedAt))}</span></td><td><span class="pill ${paused ? 'paused' : 'ok'}">${paused ? 'PAUSED' : 'ACTIVE'}</span></td><td><div class="actions"><button class="secondary" onclick="toggle(${w.id},${paused})">${paused ? 'Resume' : 'Pause'}</button><button class="secondary" onclick="snooze(${w.id})">Snooze</button><button class="danger" onclick="removeWatch(${w.id})">Delete</button></div></td></tr>`;
  }
  async function toggle(id, paused) { try { await api(`/api/watches/${id}/${paused ? 'resume' : 'acknowledge'}`, {method:'POST'}); await load(); } catch(e) { message(e.message, true); } }
  async function snooze(id) { const minutes = prompt('Snooze for how many minutes?', '15'); if (minutes === null) return; try { await api(`/api/watches/${id}/snooze?minutes=${encodeURIComponent(minutes)}`, {method:'POST'}); await load(); } catch(e) { message(e.message, true); } }
  async function removeWatch(id) { if (!confirm(`Delete watch #${id}?`)) return; try { await api(`/api/watches/${id}`, {method:'DELETE'}); await load(); } catch(e) { message(e.message, true); } }
  $('refresh').addEventListener('click', load);
  $('check').addEventListener('click', async () => { try { const result=await api('/api/watches/check-now', {method:'POST'}); await load(); message(result.status==='BUSY'?'A ticket check is already running. Try again shortly.':`Check finished. Provider requests accepted: ${result.notificationsSent}`); } catch(e) { message(e.message, true); } });
  $('export').addEventListener('click', async () => { try { const watches=await api('/api/admin/watches'); const url=URL.createObjectURL(new Blob([JSON.stringify(watches,null,2)],{type:'application/json'})); const a=document.createElement('a'); a.href=url; a.download='district-watches-backup.json'; a.click(); URL.revokeObjectURL(url); message('Watch backup downloaded. Keep it private.'); } catch(e){message(e.message,true);} });
  $('import').addEventListener('click', () => $('backupFile').click());
  $('backupFile').addEventListener('change', async event => { const file=event.target.files[0]; if(!file)return; try { const data=JSON.parse(await file.text()); if(!Array.isArray(data))throw new Error('Backup must contain an array of watches.'); if(!confirm(`Import up to ${data.length} watches? Existing matching watches will be skipped.`))return; const result=await api('/api/admin/watches/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); await load(); message(`Imported ${result.imported} watches; skipped ${result.skipped}.`); } catch(e){message(e.message,true);} finally{event.target.value='';} });
</script>
</body>
</html>
